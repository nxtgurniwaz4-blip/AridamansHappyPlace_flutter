# Example only. I did not see your original codemagic.yaml signing setup, so merge the
# marked lines into your own workflow instead of replacing it.
workflows:
  ios-flutter:
    name: Aridman iOS (Flutter)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      groups:
        - youtube            # your existing group holding YOUTUBE_API_KEY
      # ...keep your existing ios_signing / app_store_connect settings here
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build IPA   # <-- the important part
        script: |
          flutter build ipa --release \
            --dart-define=YOUTUBE_API_KEY=$YOUTUBE_API_KEY
    artifacts:
      - build/ios/ipa/*.ipa
